<!DOCTYPE html>
<html>

<head>
<title>SmartApp</title>
  <!-- === เพิ่มส่วนนี้ === -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- ==================== -->  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <link rel="shortcut icon" href="https://lh5.googleusercontent.com/d/1bSkk2AYPALpi_b7J_eg6DrkYZ-eP6G-k">
</head>

<body>
  <iframe style="position: absolute;top: 0;left: 0;width: 100%;height: 100%;border: 0;"
src="https://script.google.com/macros/s/AKfycbzJJFVFuvFPyTc80PwIW2_7WXXsFxAS8_Ye2w_yD3nFQXsa2T0XCdluGdtRfgy-OSn6Wg/exec"></iframe>
  <!-- === เพิ่มก่อนปิด body === -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
  <!-- ========================= -->
   </body>
</html>
