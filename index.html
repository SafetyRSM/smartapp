<!DOCTYPE html>
<html>

<head>
<title>SmartApp</title>
  <!-- === เพิ่มส่วนนี้ === -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- ==================== -->  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <link rel="shortcut icon" href="https://lh5.googleusercontent.com/d/1bSkk2AYPALpi_b7J_eg6DrkYZ-eP6G-k">
</head>

<body>
  <div id="openChromeBanner" style="display:none; position:fixed; top:0; left:0; right:0;
     background:#0d47a1; color:#fff; padding:12px; text-align:center; z-index:9999;">
  ⚠️ กรุณาเปิดผ่าน Chrome เพื่อติดตั้งแอปได้
  <br>
  <button onclick="openInChrome()" style="margin-top:8px; padding:6px 16px; 
     background:#fff; color:#0d47a1; border:none; border-radius:4px;">
    เปิดใน Chrome
  </button>
</div>

<script>
  function isInAppBrowser() {
    const ua = navigator.userAgent.toLowerCase();
    return /line|fban|fbav|instagram|micromessenger/.test(ua);
  }

  function openInChrome() {
    const url = window.location.href.replace(/^https?:\/\//, '');
    const isAndroid = /android/.test(navigator.userAgent.toLowerCase());
    
    if (isAndroid) {
      // Android: เด้งเปิด Chrome โดยตรงผ่าน intent
      window.location.href = 'intent://' + url + 
        '#Intent;scheme=https;package=com.android.chrome;end';
    } else {
      // iOS: ไม่มีทางบังคับได้ 100% ให้บอกวิธี copy ลิงก์แทน
      alert('กรุณาแตะปุ่ม ⋯ หรือ ⋮ มุมขวาบน แล้วเลือก "เปิดใน Safari/Chrome"');
    }
  }

  if (isInAppBrowser()) {
    document.getElementById('openChromeBanner').style.display = 'block';
  }
</script>
  <!-- วางไว้บนสุดของ body -->
<div id="installBar" style="display:none; position:sticky; top:0; z-index:9999;
     background:#0d47a1; color:#fff; padding:10px 16px; 
     display:flex; align-items:center; justify-content:space-between;">
  <span>📲 ติดตั้งแอปนี้ไว้ในเครื่องของคุณ</span>
  <button id="installBtn" style="padding:6px 14px; background:#fff; 
     color:#0d47a1; border:none; border-radius:6px; font-weight:bold;">
    ติดตั้ง
  </button>
</div>

<script>
  let deferredPrompt;
  const bar = document.getElementById('installBar');
  const btn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    bar.style.display = 'flex'; // โชว์แถบเองแทนที่จะรอ Chrome
  });

  btn.addEventListener('click', async () => {
    bar.style.display = 'none';
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    bar.style.display = 'none';
  });
</script>
  <iframe style="position: absolute;top: 0;left: 0;width: 100%;height: 100%;border: 0;"
src="https://script.google.com/macros/s/AKfycbzJJFVFuvFPyTc80PwIW2_7WXXsFxAS8_Ye2w_yD3nFQXsa2T0XCdluGdtRfgy-OSn6Wg/exec"></iframe>
  <!-- === เพิ่มก่อนปิด body === -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
  <!-- ========================= -->
   </body>
</html>
